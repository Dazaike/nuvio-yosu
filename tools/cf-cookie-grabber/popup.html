<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<style>
  :root {
    --bg: #0f1115;
    --fg: #e8eaee;
    --muted: #8b919c;
    --line: #23272f;
    --hover: #1a1d24;
    --accent: #f6821f;
    --ok: #3ecf8e;
    --err: #ff6b6b;
  }
  * { box-sizing: border-box; }
  body {
    width: 360px;
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  header { padding: 16px 16px 12px; border-bottom: 1px solid var(--line); }
  .title { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .title h1 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
  .badge {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 11px; color: var(--muted);
  }
  .badge::before {
    content: ""; width: 7px; height: 7px; border-radius: 50%;
    background: var(--muted);
  }
  .badge.ok { color: var(--ok); }
  .badge.ok::before { background: var(--ok); box-shadow: 0 0 0 3px rgba(62, 207, 142, .18); }
  .badge.miss { color: var(--err); }
  .badge.miss::before { background: var(--err); }
  #host { margin-top: 4px; color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }

  .field {
    display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 4px 12px;
    padding: 12px 16px; border-bottom: 1px solid var(--line);
  }
  .field label { grid-column: 1; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  .field .val {
    grid-column: 1; font: 12px ui-monospace, "Cascadia Mono", Consolas, monospace;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0;
  }
  .field button { grid-column: 2; grid-row: 1 / span 2; }
  #expiry { padding: 10px 16px; color: var(--muted); font-size: 12px; border-bottom: 1px solid var(--line); }

  button {
    font: inherit; color: var(--fg); background: transparent;
    border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; cursor: pointer;
    transition: background .12s, border-color .12s, color .12s;
  }
  button:hover:not(:disabled) { background: var(--hover); border-color: #343a46; }
  button:disabled { opacity: .4; cursor: default; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.done { color: var(--ok); border-color: var(--ok); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #17110a; font-weight: 600; }
  button.primary:hover:not(:disabled) { background: #ff9238; border-color: #ff9238; }
  button.primary.done { background: transparent; color: var(--ok); border-color: var(--ok); }

  footer { display: flex; gap: 8px; padding: 12px 16px; }
  footer .spacer { flex: 1; }

  #msg { padding: 12px 16px 16px; color: var(--muted); font-size: 12px; }
  #msg:empty { display: none; }
  #msg.err { color: var(--err); }

  [hidden] { display: none !important; }
  @media (prefers-reduced-motion: reduce) { button { transition: none; } }
</style>
</head>
<body>
  <header>
    <div class="title">
      <h1>cf_clearance</h1>
      <span id="badge" class="badge">Checking</span>
    </div>
    <div id="host"></div>
  </header>

  <section id="fields" hidden>
    <div class="field">
      <label for="cfBtn">cf_clearance</label>
      <div class="val" id="cfVal"></div>
      <button id="copyCf" type="button">Copy</button>
    </div>
    <div class="field">
      <label for="uaBtn">User-Agent</label>
      <div class="val" id="uaVal"></div>
      <button id="copyUa" type="button">Copy</button>
    </div>
    <div id="expiry"></div>
  </section>

  <footer>
    <button id="copy" class="primary" type="button" disabled>Copy JSON</button>
    <button id="save" type="button" disabled>Save cf.json</button>
    <span class="spacer"></span>
    <button id="refresh" type="button">Refresh</button>
  </footer>
  <div id="msg" role="status"></div>
  <script src="popup.js"></script>
</body>
</html>
